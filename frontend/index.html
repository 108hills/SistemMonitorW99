<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Warkop 99 — Masuk</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app app--login">
        <div class="pattern-bg" aria-hidden="true"></div>
        <div class="login-brand">
            <img src="website_images/logo99.jpg" alt="Warkop 99" class="login-logo">
            <h1>Warkop99</h1>
            <p style="color: white; font-weight: bold;">Sistem Monitor Stok</p>
        </div>

        <div class="login-card">
            <h2>Masuk ke akun</h2>
            <form id="loginForm">
                <div class="field">
                    <label for="emailInput">Email</label>
                    <input type="email" id="emailInput" class="field__input" placeholder="nama@warkop99.com" required>
                </div>
                <div class="field">
                    <label for="passwordInput">Password</label>
                    <div class="field__wrap">
                        <input type="password" id="passwordInput" class="field__input field__input--icon" placeholder="••••••••" required>
                        <button type="button" class="field__toggle" id="togglePassword" aria-label="Tampilkan password">
                            <svg id="eyeSlashIcon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/></svg>
                            <svg id="eyeOpenIcon" style="display:none" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg>
                        </button>
                    </div>
                </div>
                <div id="loginErrorMsg" class="error-message"></div>
                <div class="form-link-row">
                    <button type="button" class="link-btn" onclick="openForgotModal(event)">Lupa password?</button>
                </div>
                <button type="submit" class="btn btn--primary">Masuk</button>
            </form>
        </div>

        <p class="login-quote">Warkop 99! Jaya! Jaya! Jaya!</p>

        <div class="modal-overlay" id="forgotModal">
            <div class="modal-sheet">
                <div class="sheet-handle"></div>
                <h3 class="sheet-title">Reset password</h3>
                <p style="font-size:0.875rem;color:var(--ink-muted);margin:-8px 0 16px;">Masukkan email, nama lengkap, dan password baru.</p>
                <div class="sheet-fields">
                    <div class="field">
                        <label for="forgotEmailInput">Email</label>
                        <input type="email" id="forgotEmailInput" class="field__input" placeholder="...@warkop99.com">
                    </div>
                    <div class="field">
                        <label for="forgotNamaInput">Nama lengkap</label>
                        <input type="text" id="forgotNamaInput" class="field__input" placeholder="Nama pegawai">
                    </div>
                    <div class="field">
                        <label for="forgotNewPasswordInput">Password baru</label>
                        <input type="password" id="forgotNewPasswordInput" class="field__input" placeholder="••••••••">
                    </div>
                </div>
                <div id="forgotErrorMsg" class="error-message"></div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn btn-batal" onclick="closeForgotModal()">Batal</button>
                    <button type="button" class="modal-btn btn-simpan" onclick="handleForgotPasswordValidation()">Reset</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
