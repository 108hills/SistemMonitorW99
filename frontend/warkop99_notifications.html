<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Warkop 99 — Notifikasi</title>
    <link rel="icon" href="website_images/favico.ico" type="image/x-icon">
    <link rel="apple-touch-icon" href="website_images/favico.ico">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app">
        <div class="pattern-bg pattern-bg--light" aria-hidden="true"></div>
        <header class="app-header">
            <div class="app-header__top">
                <div>
                    <h1>Notifikasi</h1>
                    <p class="app-header__hint">Stok Rendah & Produk Baru</p>
                </div>
            </div>
            <div class="search">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                <input type="search" id="notifSearchInput" placeholder="Cari…" autocomplete="off">
            </div>
        </header>

        <main class="app-main">
            <div class="tabs-wrapper segment">
                <button type="button" class="tab-btn" onclick="switchNotifTab('stok_rendah', this)">Stok Rendah</button>
                <button type="button" class="tab-btn" onclick="switchNotifTab('produk_baru', this)">Produk Baru</button>
            </div>
            <div id="notificationList"></div>
        </main>

        <nav class="tab-bar">
            <span class="tab-bar__item is-active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                Notifikasi
            </span>
            <a href="warkop99_dashboard.html" class="tab-bar__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01 20.73 6.96M12 22.08V12"/></svg>
                Stok
            </a>
            <a href="warkop99_profile.html" class="tab-bar__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Akun
            </a>
        </nav>
    </div>
</body>
</html>
