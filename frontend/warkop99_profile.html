<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Warkop 99 — Akun</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <div class="app">
        <div class="pattern-bg pattern-bg--light" aria-hidden="true"></div>
        <header class="app-header">
            <div class="app-header__top">
                <div>
                    <h1 id="pageTitle">Akun</h1>
                    <p class="app-header__hint" id="pageHint">Profil & pengaturan</p>
                </div>
            </div>
        </header>

        <main class="app-main" id="view-profile">
            <div class="profile-card">
                <label for="profileImageInput" class="profile-card__avatar-wrap">
                    <img id="profileUserImg" src="website_images/logo99.jpg" alt="" class="profile-card__avatar">
                    <span class="profile-card__edit">✎</span>
                </label>
                <input type="file" id="profileImageInput" accept="image/*" hidden>
                <div>
                    <h2 id="loggedPegawaiName">Memuat…</h2>
                    <p id="loggedPegawaiRole">Pegawai</p>
                </div>
            </div>

            <p class="settings-label">Pengaturan</p>
            <div class="settings-list">
                <div class="settings-item" onclick="openPasswordModal()">
                    <img src="website_images/keamanan.png" alt="">
                    <div>
                        <h3>Keamanan</h3>
                        <p>Ubah password</p>
                    </div>
                </div>
                <div class="settings-item" onclick="showHistory()">
                    <img src="website_images/riwayat.png" alt="">
                    <div>
                        <h3>Riwayat</h3>
                        <p>Aktivitas stok & produk</p>
                    </div>
                </div>
                
            </div>
            <div class="settings-item settings-item--logout" onclick="logoutAccount()">
                <h3>Keluar</h3>
            </div>
        </main>

        <main class="app-main view-hidden" id="view-history">
            <button type="button" class="btn-text" onclick="showProfile()">← Kembali</button>
            <div class="tabs-wrapper">
                <button type="button" class="tab-btn active-blue" onclick="filterHistory('ALL', this)">Semua</button>
                <button type="button" class="tab-btn" onclick="filterHistory('MASUK', this)">Masuk</button>
                <button type="button" class="tab-btn" onclick="filterHistory('KELUAR', this)">Keluar</button>
                <button type="button" class="tab-btn" onclick="filterHistory('PRODUK BARU', this)">Baru</button>
                <button type="button" class="tab-btn" onclick="filterHistory('UPDATE', this)">Update</button>
                <button type="button" class="tab-btn" onclick="filterHistory('DELETE', this)">Hapus</button>
            </div>
            <div id="history-list"></div>
        </main>

        <nav class="tab-bar">
            <a href="warkop99_notifications.html" class="tab-bar__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
                Notifikasi
            </a>
            <a href="warkop99_dashboard.html" class="tab-bar__item">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 16V8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4A2 2 0 0 0 21 16z"/><path d="M3.27 6.96 12 12.01 20.73 6.96M12 22.08V12"/></svg>
                Stok
            </a>
            <span class="tab-bar__item is-active">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/></svg>
                Akun
            </span>
        </nav>

        <div class="modal-overlay" id="passwordModal">
            <div class="modal-sheet">
                <div class="sheet-handle"></div>
                <h3 class="sheet-title">Ubah password</h3>
                <div class="sheet-fields">
                    <div class="field">
                        <label for="oldPassword">Password lama</label>
                        <input type="password" id="oldPassword" class="field__input" placeholder="••••••••">
                    </div>
                    <div class="field">
                        <label for="newPassword">Password baru</label>
                        <input type="password" id="newPassword" class="field__input" placeholder="••••••••">
                    </div>
                    <div class="field">
                        <label for="verifyPassword">Ulangi password baru</label>
                        <input type="password" id="verifyPassword" class="field__input" placeholder="••••••••">
                    </div>
                </div>
                <div id="profileErrorMsg" class="error-message"></div>
                <div class="modal-actions">
                    <button type="button" class="modal-btn btn-batal" onclick="closePasswordModal()">Batal</button>
                    <button type="button" class="modal-btn btn-simpan" onclick="saveNewPassword()">Simpan</button>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
