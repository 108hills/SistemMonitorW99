<!DOCTYPE html>
<html lang="en">
<head>

    <title>Warkop 99 - Login</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <div class="mobile-container login-bg">

            <div class="logo-circle">
                <span>🍜☕<br>99</span>
            </div>
            <div class="logo-text">WARKOP 99</div>
        </div>

        <div class="login-bottom-card">
            <div>
                <h2 class="login-heading">Login to your account</h2>
                
                <div class="input-group">
                    <input type="email" value="pegawai123@warkop99.com" readonly>
                </div>
                
                <div class="input-group">
                    <div class="input-with-icon">
                        <input type="password" value="**********" readonly>
                        <span class="eye-icon">👁️</span>
                    </div>
                </div>
                
                <a href="#" class="forgot-link">Forgot password?</a>
                
                <button class="login-btn" onclick="handleLogin()">Login</button>
            </div>
            
            <div class="footer-text">"Warkop 99! Jaya! Jaya! Jaya!"</div>
        </div>

    </div>
    
    <script src="app.js"></script>
