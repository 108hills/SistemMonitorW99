<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warkop 99 - Profile</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="mobile-container profile-bg">
        
        <div class="content-card full-height">
            <div class="profile-header-card">
                <img src="assets/kadhim.jpg" alt="Ahmad Kadhim" class="profile-img">
                <div class="profile-info">
                    <h2>AHMAD KADHIM</h2>
                    <p>Pegawai</p>
                </div>
            </div>

            <div class="profile-menu">
                <div class="menu-btn" onclick="openModal('passwordModal')">
                    <div class="icon-box">👤</div>
                    <div>
                        <h3>Keamanan Akun</h3>
                        <p>Ubah kata sandi</p>
                    </div>
                </div>

                <div class="menu-btn">
                    <div class="icon-box">📄</div>
                    <div>
                        <h3>Riwayat & Aktivitas</h3>
                        <p>Perubahan pada stok/produk</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="passwordModal">
            <div class="modal-content">
                <div class="modal-header-center">
                    <div class="icon-box large">👤</div>
                    <h3>Ubah Password</h3>
                </div>
                <div class="input-group-modal">
                    <label>Password Baru</label>
                    <div class="input-with-icon">
                        <input type="password" placeholder="password123">
                        <span class="eye-icon">👁️</span>
                    </div>
                </div>
                <div class="input-group-modal">
                    <label>Verifikasi Password</label>
                    <div class="input-with-icon">
                        <input type="password" placeholder="password123">
                        <span class="eye-icon">👁️</span>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal('passwordModal')">BATAL</button>
                    <button class="btn-save" onclick="closeModal('passwordModal')">SIMPAN</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" onclick="window.location.href='notifications.html'">🔔</button>
            <button class="nav-btn" onclick="window.location.href='dashboard.html'">📦</button>
            <button class="nav-btn active-nav">👤</button>
        </div>
    </div>
    <script src="app.js"></script>
</body>
</html>
