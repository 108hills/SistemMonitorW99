<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Warkop 99 - Dashboard</title>
    <link rel="stylesheet" href="styles.css"> 
</head>
<body>
    <div class="mobile-container">
        
        <div class="header-section">
            <h1 class="header-title">DASHBOARD</h1>
            <div class="search-bar">
                <span class="search-icon">🔍</span>
                <input type="text" placeholder="Search..">
            </div>
        </div>

        <div class="content-card">
            <div class="menu-divider">
                <span>MENU</span>
                <p>Tekan untuk edit!</p>
            </div>

            <div class="item-card" onclick="openEditModal('Mie Goreng Kadim')">
                <img src="assets/mie-goreng.jpg" alt="Mie Goreng" class="item-image">
                <div class="item-details">
                    <div class="item-name">Mie Goreng Kadim</div>
                    <div class="item-stock">
                        <span>STOK</span>
                        <span class="stock-number">15</span>
                    </div>
                </div>
            </div>

            <div class="item-card" onclick="openEditModal('Cumi Asam Manis')">
                <img src="assets/cumi.jpg" alt="Cumi" class="item-image">
                <div class="item-details">
                    <div class="item-name">Cumi Asam Manis</div>
                    <div class="item-stock">
                        <span>STOK</span>
                        <span class="stock-number">3</span>
                    </div>
                </div>
            </div>
        </div>

        <button class="floating-add-btn" onclick="openModal('addModal')">+</button>

        <div class="modal-overlay" id="editModal">
            <div class="modal-content">
                <div class="modal-header">
                    <img src="assets/cumi.jpg" alt="Cumi" class="modal-img">
                    <h3>Edit Produk</h3>
                </div>
                <div class="stock-control">
                    <span>STOK</span>
                    <div class="stepper">
                        <button onclick="updateStock('editStock', -1)">-</button>
                        <input type="number" id="editStock" value="3" readonly>
                        <button onclick="updateStock('editStock', 1)">+</button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal('editModal')">BATAL</button>
                    <button class="btn-save" onclick="closeModal('editModal')">SIMPAN</button>
                </div>
            </div>
        </div>

        <div class="modal-overlay" id="addModal">
            <div class="modal-content">
                <div class="modal-header">
                    <div class="img-placeholder">+</div>
                    <h3>Tambah Produk</h3>
                </div>
                <div class="input-group-modal">
                    <label>Nama Produk</label>
                    <input type="text" placeholder="produk123">
                </div>
                <div class="stock-control">
                    <span>STOK</span>
                    <div class="stepper">
                        <button onclick="updateStock('addStock', -1)">-</button>
                        <input type="number" id="addStock" value="3" readonly>
                        <button onclick="updateStock('addStock', 1)">+</button>
                    </div>
                </div>
                <div class="modal-actions">
                    <button class="btn-cancel" onclick="closeModal('addModal')">BATAL</button>
                    <button class="btn-save" onclick="closeModal('addModal')">SIMPAN</button>
                </div>
            </div>
        </div>

        <div class="bottom-nav">
            <button class="nav-btn" onclick="window.location.href='notifications.html'">🔔</button>
            <button class="nav-btn active-nav">📦</button>
            <button class="nav-btn" onclick="window.location.href='profile.html'">👤</button>
        </div>

    </div>
    
    <script src="app.js"></script>
</body>
</html>
